<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>og</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Work+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden;
    background: #F6F1E7;
    font-family: 'Work Sans', sans-serif;
  }
  .wrap {
    width: 1200px; height: 630px;
    display: flex; flex-direction: column; justify-content: center;
    padding: 80px 90px;
    position: relative;
  }
  .dots { position: absolute; top: 64px; left: 90px; display: flex; gap: 10px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; }
  .eyebrow {
    font-size: 20px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: #3D5A80; margin: 0 0 22px;
  }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 58px; line-height: 1.14;
    color: #262220; margin: 0 0 26px; max-width: 950px;
  }
  p { font-size: 26px; color: #55504A; margin: 0; max-width: 820px; line-height: 1.4; }
  .footer-row {
    position: absolute; bottom: 64px; left: 90px; right: 90px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 20px; color: #837C73; font-weight: 600;
  }
  .pill { display: flex; gap: 14px; }
  .pill span {
    background: #FFFFFF; border: 1px solid #D2C7AC; border-radius: 100px;
    padding: 8px 20px; font-size: 18px; color: #55504A;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dots">
      <div class="dot" style="background:#3D5A80"></div>
      <div class="dot" style="background:#6B4E8E"></div>
      <div class="dot" style="background:#3F8E82"></div>
    </div>
    <p class="eyebrow">Plan Piloto · Ovalle · Punitaqui · Monte Patria · Combarbalá</p>
    <h1>Detecta a tiempo el cáncer gástrico y colorrectal</h1>
    <p>Tres exámenes gratuitos y no invasivos. Infórmate, agenda y resuelve tus dudas.</p>
    <div class="footer-row">
      <span>Servicio de Salud Coquimbo</span>
      <div class="pill"><span>Panel Serológico</span><span>Test H. pylori</span><span>Test FIT</span></div>
    </div>
  </div>
</body>
</html>
